---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-pulse --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "date": "2026-03-16",
    "levers": [
      {
        "label": "Continuity (awake)",
        "value": "18m",
        "target": "<=20m",
        "tier": "CRITICAL",
        "mark": "GREEN"
      },
      {
        "label": "REM",
        "value": "96m",
        "target": ">=90m",
        "tier": "CRITICAL",
        "mark": "GREEN"
      },
      {
        "label": "Sleep hours",
        "value": "7.6h",
        "target": ">=7.5h",
        "tier": "CRITICAL",
        "mark": "GREEN"
      },
      {
        "label": "Trailing sleep debt",
        "value": "38m/night",
        "target": "<=30m, 8m to green",
        "tier": "CRITICAL",
        "mark": "YELLOW"
      },
      {
        "label": "Deep sleep",
        "value": "68m",
        "target": ">=75m, 7m to green",
        "tier": "CRITICAL",
        "mark": "YELLOW"
      },
      {
        "label": "Bedtime",
        "value": "11:20 PM",
        "target": "<=11:00 PM, 20m to green",
        "tier": "MODERATE",
        "mark": "RED"
      },
      {
        "label": "Awakenings",
        "value": "2x",
        "target": "<=1x, 1x to green",
        "tier": "MODERATE",
        "mark": "YELLOW"
      },
      {
        "label": "Wake time",
        "value": "6:50 AM",
        "target": "<=7:00 AM",
        "tier": "MODERATE",
        "mark": "GREEN"
      },
      {
        "label": "QQRT score",
        "value": "2/3",
        "target": ">=2",
        "tier": "MODERATE",
        "mark": "GREEN"
      }
    ],
    "verdict_mark": "GREEN",
    "verdict": "Primed - the setup for a great day is in range.",
    "move": "Bank sleep - carrying 38m/night of trailing debt; an earlier bedtime compounds it down over ~2 weeks.",
    "exercise_label": "Morning walk",
    "exercise_done": true,
    "exercise_text": "done"
  }
