---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-pulse --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "title": "Body first",
    "date": "Mon Jan 6",
    "horizon": "Today: sleep and exercise decide what today can hold.",
    "sleep": "7.2 hours, 25 minutes awake",
    "broken_night": false,
    "exercise_label": "Morning walk",
    "exercise": "Yes, done today.",
    "exercise_status": "YELLOW",
    "exercise_month": "morning walk on 12 of the last 30 days",
    "verdict_status": "YELLOW",
    "verdict": "Most levers on target; bedtime slipped.",
    "move": "Lights out 30 minutes earlier tonight.",
    "single_pick": "",
    "levers": [
      {
        "label": "Bedtime",
        "status": "RED",
        "value": "11:40 PM",
        "target": "<= 10:45 PM",
        "month": "9 of 30"
      },
      {
        "label": "Sleep hours",
        "status": "YELLOW",
        "value": "7.2h",
        "target": ">= 7.5h",
        "month": "15 of 30"
      },
      {
        "label": "Continuity (awake)",
        "status": "GREEN",
        "value": "25 min",
        "target": "<= 30 min",
        "month": "21 of 30"
      },
      {
        "label": "Deep sleep",
        "status": "GREEN",
        "value": "80 min",
        "target": ">= 60 min",
        "month": "24 of 30"
      }
    ],
    "window": 30
  }
