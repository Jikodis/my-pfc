---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-pulse-trend --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "window": 30,
    "from": "2026-02-15",
    "to": "2026-03-16",
    "levers": [
      {
        "id": "bedtime",
        "label": "Bedtime",
        "n": 30,
        "target": "<=11:00 PM",
        "tier": "MODERATE",
        "last": "11:20 PM",
        "on": 9,
        "status": "RED"
      },
      {
        "id": "deep",
        "label": "Deep sleep",
        "n": 30,
        "target": ">=75m",
        "tier": "CRITICAL",
        "last": "68m",
        "on": 16,
        "status": "YELLOW"
      },
      {
        "id": "debt",
        "label": "Trailing sleep debt",
        "n": 30,
        "target": "<=30m",
        "tier": "CRITICAL",
        "last": "38m/night",
        "on": 18,
        "status": "YELLOW"
      },
      {
        "id": "hours",
        "label": "Sleep hours",
        "n": 30,
        "target": ">=7.5h",
        "tier": "CRITICAL",
        "last": "7.6h",
        "on": 19,
        "status": "YELLOW"
      },
      {
        "id": "awakenings",
        "label": "Awakenings",
        "n": 30,
        "target": "<=1x",
        "tier": "MODERATE",
        "last": "2x",
        "on": 21,
        "status": "GREEN"
      },
      {
        "id": "rem",
        "label": "REM",
        "n": 30,
        "target": ">=90m",
        "tier": "CRITICAL",
        "last": "96m",
        "on": 23,
        "status": "GREEN"
      },
      {
        "id": "wake",
        "label": "Wake time",
        "n": 30,
        "target": "<=7:00 AM",
        "tier": "MODERATE",
        "last": "6:50 AM",
        "on": 24,
        "status": "GREEN"
      },
      {
        "id": "continuity",
        "label": "Continuity (awake)",
        "n": 30,
        "target": "<=20m",
        "tier": "CRITICAL",
        "last": "18m",
        "on": 25,
        "status": "GREEN"
      },
      {
        "id": "qqrt",
        "label": "QQRT score",
        "n": 30,
        "target": ">=2",
        "tier": "MODERATE",
        "last": "2/3",
        "on": 26,
        "status": "GREEN"
      }
    ],
    "chronic": {
      "label": "Bedtime",
      "n": 30,
      "fix": "Get horizontal earlier - the cheapest lever you fully control, and it feeds hours, REM and debt at once.",
      "on": 9,
      "status": "RED"
    },
    "green_days": 17
  }
