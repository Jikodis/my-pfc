---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-projects --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "projects": [
      {
        "name": "Learn Spanish",
        "percent": 45,
        "parts": "9/20",
        "deadline_disp": "",
        "tasks": [
          {
            "title": "Finish unit 9 vocabulary drills"
          },
          {
            "title": "Book the next conversation session"
          }
        ]
      },
      {
