---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-front-of-mind --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "title": "Front of mind",
    "horizon": "Always: the anchors to keep in view.",
    "anchors": [
      {
        "title": "Slow is smooth, smooth is fast.",
        "area": "personal",
        "text_size": "large",
        "text_size_lg": "xlarge"
      },
      {
        "title": "Say the hard thing early, kindly.",
        "area": "relationship",
        "text_size": "large",
        "text_size_lg": "xlarge"
      }
    ],
    "anchors_rotated": [
      {
        "title": "Say the hard thing early, kindly.",
        "area": "relationship",
        "text_size": "large",
        "text_size_lg": "xlarge"
      },
      {
        "title": "Slow is smooth, smooth is fast.",
        "area": "personal",
        "text_size": "large",
        "text_size_lg": "xlarge"
      }
    ],
    "count": 2,
    "poster": true
  }
