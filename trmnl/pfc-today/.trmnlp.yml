---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

# Sample merge variables live below the marker. They ship as placeholder data so
# the preview renders before your repo has history. Regenerate them from real
# repo state instead of hand-editing:
#
#   python3 automations/scripts/trmnl_push.py pfc-today --local

# --- generated by trmnl_push.py --local (do not hand-edit below) ---
variables:
  {
    "title": "Tasks",
    "date": "Mon Jan 6",
    "horizon": "A day: today's 2+1.",
    "picks": [
      {
        "title": "Draft the outline for Project Foo",
        "done": true,
        "kind": "Pick 1"
      },
      {
        "title": "Book the dentist",
        "done": false,
        "kind": "Pick 2"
      },
      {
        "title": "Sort the pantry",
        "done": false,
        "kind": "Bonus"
      }
    ],
    "picks_note": "",
    "done": 1,
    "total": 3,
    "evening": false,
    "tomorrow_label": "",
    "tomorrow": [],
    "single_pick": false,
    "needs_you": [
      {
        "title": "Renew the car registration",
        "why": "due Fri Jan 10"
      },
      {
        "title": "Reply to the landlord",
        "why": "waiting on you"
      }
    ],
    "handoffs": [
      "Compare three phone plans",
      "Register the new blender warranty"
    ]
  }
