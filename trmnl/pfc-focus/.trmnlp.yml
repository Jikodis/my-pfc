---
# Local dev-server config for `trmnlp serve`. Never uploaded to TRMNL.
watch:
  - src
  - .trmnlp.yml

custom_fields: {}

framework_version: latest

# Set this to your own IANA timezone (the same value as LOCAL_TZ in .env).
time_zone: America/Denver

