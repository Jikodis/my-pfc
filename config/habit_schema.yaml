# Habit definitions and frequency limits
#
# Daily habits: max 14 at a time, frequency 1-7 per week
# Monthly habits: max 6 at a time, frequency 1-4 per month
# (The daily cap is enforced in scripts/validate.sh — keep the two in sync.)
#
# Each habit must declare:
#   area: which life area it serves (must match a folder in 2-areas/)
#   values: which values from 1-values/values.md it serves
#
# Each habit may optionally declare:
#   vision: slug of a vision in 3-visions/ that this habit supports as a
#     leading indicator. When set, vision-progress reporting links them.
#   ramp: {starter, target, two_minute} — for habits not yet automatic.
#     `frequency` is the LIVE ramped value (never read ramp.target for rate
#     math). Two green weeks propose a +1 step toward target; one red week
#     steps -1 automatically, never below starter. `two_minute` is the
#     scaled-down version the never-miss-twice rule offers after two
#     consecutive misses. See docs/habit-mechanics.md.
#
# Starter habits below — edit, add, or remove to match your life.
# Habits with an objective wearable signal are pre-filled from day-tracking health data at the evening check-in
# once you have that integration configured. See docs/install/connectors.md.

daily_habits:
  - id: morning-walk
    description: "20+ minute walk within 90 minutes of waking"
    frequency: 5  # times per week (max 7) — the LIVE ramped value
    area: health
    values: [Health]
    started: "YYYY-MM-DD"  # replace with your start date
    ramp:
      starter: 2
      target: 5
      two_minute: "Put shoes on and step outside"

  - id: read-15-min
    description: "15+ minutes of reading (any format: book, article, long-form)"
    frequency: 7  # times per week (max 7)
    area: personal
    values: [Learning, Growth]
    started: "YYYY-MM-DD"

  - id: hydration-2L
    description: "2L water consumed by end of day"
    frequency: 7  # times per week (max 7)
    area: health
    values: [Health]
    started: "YYYY-MM-DD"

  - id: sleep-on-time
    description: "In bed by your target time"
    frequency: 7  # times per week (max 7)
    area: health
    values: [Health]
    started: "YYYY-MM-DD"
    auto_derived: true  # filled from watch sleep data by derive_sleep_habit.py; remove if you log it by hand

monthly_habits:
  - id: system-review
    description: "Run /pfc-review — catch up on all due rolling reviews (life wheel, projects, habits)"
    frequency: 1  # times per month (max 4)
    area: personal
    values: [Growth, Learning]
    started: "YYYY-MM-DD"

  - id: social-time
    description: "At least one in-person social interaction with someone you care about"
    frequency: 1  # times per month (max 4)
    area: relationship
    values: [Friendship, Love]
    started: "YYYY-MM-DD"

# Deprecated habits section — move retired habits here to preserve log continuity.
# Historical records in 7-habits/_data/habits-daily.ndjson stay valid; just don't
# add new log entries under deprecated IDs.
deprecated_habits: []
