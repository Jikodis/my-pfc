# Schema for data/review-ledger.ndjson — the Rolling Reviews ledger.
#
# One record per review item. The weekly / monthly / quarterly review work that
# used to live in separate batch check-in rituals now lives here and drips
# through the evening check-in (≤2 due items per night) or one at a time via
# /pfc-review.
#
# An item is a *candidate* once  today - last_done >= cadence_days.
# Each candidate is then filtered through a per-id **gate** defined in
# pfc-evening-checkin Step 3c — a small check that returns a reason string only
# when there is genuinely something to act on. A due-but-empty-gate item
# silently passes (not shown, not stamped) and re-checks the next night.
#
# The seed ships every item with last_done "2000-01-01" — a far-past sentinel
# meaning "never reviewed." Everything is due on day one; the ≤2/night cap keeps
# that from becoming a wall of reviews, and each item's real cadence starts the
# first time you engage with it.

required_fields:
  - id            # stable slug mapped to a gate in pfc-evening-checkin Step 3c
  - label         # human-readable name shown in chat
  - tier          # weekly | monthly | quarterly
  - cadence_days  # minimum days between surfacings (int > 0; 7 / 30 / 90)
  - last_done     # YYYY-MM-DD it was last surfaced-and-engaged
optional_fields:
  - seen          # row ids answered so far when a review had more rows than one form holds; cleared when stamped
  - weekday_hint  # 0=Mon..6=Sun soft ordering preference, or null
enums:
  tier: [weekly, monthly, quarterly]
