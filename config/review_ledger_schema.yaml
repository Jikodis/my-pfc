# Schema for data/review-ledger.ndjson — the Rolling Reviews ledger.
#
# One record per review item. The weekly / monthly / quarterly review work that
# used to live in separate batch check-in rituals now lives here. The home page
# tour shows at most one due item a day; /pfc-review clears every due item at once.
#
# An item is a *candidate* once  today - last_done >= cadence_days.
# In /pfc-review each candidate is then filtered through a per-id **gate**
# (pfc-review Step 1) — a small check that returns a reason string only when
# there is genuinely something to act on. A due-but-empty-gate item silently
# passes (not shown, not stamped) and re-checks next time.
#
# The seed ships every item with last_done "2000-01-01" — a far-past sentinel
# meaning "never reviewed." Everything is due on day one; the tour's one-a-day
# cap keeps that from becoming a wall of reviews, and each item's real cadence
# starts the first time you engage with it.

required_fields:
  - id            # stable slug mapped to a gate in pfc-review Step 1
  - label         # human-readable name shown in chat
  - tier          # weekly | monthly | quarterly
  - cadence_days  # minimum days between surfacings (int > 0; 7 / 30 / 90)
  - last_done     # YYYY-MM-DD it was last surfaced-and-engaged
optional_fields:
  - weekday_hint  # 0=Mon..6=Sun soft ordering preference, or null
enums:
  tier: [weekly, monthly, quarterly]
