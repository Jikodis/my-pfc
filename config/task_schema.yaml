# Task schema for 6-tasks/_data/tasks.ndjson.
# All tasks — strategic and operational — live in one list.

task:
  id:
    type: string
    format: "task-YYYYMMDD-NNN"
    required: true
  status:
    type: string
    enum: ["open", "done"]
    required: true
  deferred:
    type: boolean
    default: false
    description: "Parked by the user — still open, but deliberately out of the daily-pick rotation until they say otherwise. Hidden from pick pools, the Trello Tasks list, and pfc-revive slippage signals. NOT a status: a deferred task is still open work, just not being offered right now. Clear it (set false / remove) when the user asks for it back."
  deferred_reason:
    type: string
    nullable: true
    description: "Why it was parked, in the user's own words. Shown when listing deferred tasks so the reason is visible at un-park time."
  description:
    type: string
    required: true
  notes:
    type: string
    nullable: true
    description: "Extended details, links, or context. Shown in calendar event body when task is scheduled."
  size:
    type: string
    enum: ["XS", "S", "M", "L", "XL"]
    required: true
  location:
    type: string
    enum: ["Home", "PC", "Errand", "Phone", "Anywhere"]
    required: true
  impact:
    type: string
    enum: ["high", "medium", "low"]
    required: true
  urgency:
    type: string
    enum: ["high", "medium", "low"]
    required: true
  agent_doable:
    type: string
    enum: ["yes", "partly", "no"]
    nullable: true
    description: >
      Who can actually execute this. "yes" — an agent with a browser can drive it
      start to finish (research, forms, purchases, portal paperwork, drafting a
      reply); the user only approves the result. "partly" — an agent does the setup
      and the user does one irreducibly human step (a phone call, a signature, being
      physically somewhere, a conversation with a person). "no" — only the user can
      do it: their learning, their body, their relationships, their creative voice.
      Null means unclassified. Why it exists: starting is often the hardest part of
      a task, so the cheapest way through a stalled task is often to not be the one
      doing it. See 6-tasks/AGENTS.md § Agent delegation.
  project:
    type: string
    default: "none"
  sequence:
    type: integer
    nullable: true
    description: "Order of this task within its project (1-based). Set on project tasks where order matters (e.g. course curricula). pfc-pick-tasks and the evening check-in only surface the lowest-sequence open task per project — higher-sequence siblings stay hidden until the prior is done. Standalone tasks (project='none') leave this null."
  area:
    type: string
    nullable: true
    description: "Lowercase folder name in 2-areas/ — used for standalone strategic tasks with no project. Validated against existing 2-areas/ folders."
  depends_on:
    type: array
    items: string
    nullable: true
    description: "Array of task IDs that must be 'done' before this task is considered ready. Omit or null when no dependencies. pfc-pick-tasks hides tasks whose depends_on entries are still open; pfc-add-task populates this when splitting a multi-step task."
  deadline:
    type: string
    format: "YYYY-MM-DD"
    nullable: true
  created:
    type: string
    format: "YYYY-MM-DD"
    required: true
  completed:
    type: string
    format: "YYYY-MM-DD"
    description: "Added when status changes to done"
  source:
    type: string
    enum: ["phone", "laptop", "automation", "chat", "morning-planning", "email-triage"]
    default: "phone"
  source_email_thread_id:
    type: string
    nullable: true
    description: "Gmail thread ID — the stable canonical identifier of the email this task came from. Primary dedup key for the email→task pipeline (pfc-email-triage Step 0): before creating a task from a labeled email, query tasks.ndjson + tasks-archive.ndjson by this field. Also drives reverse reconciliation — when the thread leaves the inbox, the linked task auto-completes. Set when source='email-triage'."
  source_email_subject:
    type: string
    nullable: true
    description: "Subject line of the source email (raw, including any Re:/Fwd: prefix). Fallback dedup key when the thread ID is missing; also shown during dedup confirmation. Set when source='email-triage'."
